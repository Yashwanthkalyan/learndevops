hpa:
  minReplicas: 1
  maxReplicas: 3
  metrics:
    type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
      name1: memory
      target1:
        type: Utilization
        averageUtilization: 80
