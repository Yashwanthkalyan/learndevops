# Default values for genwizard-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
app:
  replicaCount: 1
  repository: 153590191236.dkr.ecr.us-east-1.amazonaws.com/genwizard-dedicated-repo-dev
  pullPolicy: Always
  tag: "genwizardai_console_aci_6_4"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  resources:
    limits:
      cpu: "2000m"
      memory: "2048Mi"
    requests:
      cpu: "2000m"
      memory: "2048Mi"

env:
  name: "ASPNETCORE_ENVIRONMENT"
  values: "Development"
  name1: "ASPNETCORE_FORWARDEDHEADERS_ENABLED"
  values1: "true"

volumes:
  name: efs-mount
  persistentVolumeClaim:
    claimName: pvc-ad-claim

volumeMounts:
  mountPath: /var/www/appConfigFiles
  name: efs-mount
  mountPath1: /mnt/myWizard-Phoenix
  mountPath2: /var/www/Logs   

service:
  ports:
    port: 80
    protocol: TCP
    targetPort: 8125
  type: ClusterIP

