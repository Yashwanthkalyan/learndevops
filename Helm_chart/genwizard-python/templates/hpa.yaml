apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Chart.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Chart.Name }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
  - type: {{ .Values.hpa.metrics.type }}
    resource:
      name: {{ .Values.hpa.metrics.resource.name }}
      target:
        type: {{ .Values.hpa.metrics.resource.target.type }}
        averageUtilization: {{ .Values.hpa.metrics.resource.target.averageUtilization }}
      name: {{ .Values.hpa.metrics.resource.name1 }}
      target:
        type: {{ .Values.hpa.metrics.resource.target1.type }}
        averageUtilization: {{ .Values.hpa.metrics.resource.target1.averageUtilization }}
