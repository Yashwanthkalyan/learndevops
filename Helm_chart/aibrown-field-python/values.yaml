hpa:                            #hpa increases pods based on the utilization levels.
  minReplicas: 1                #vpa increases cpu/memory of pod based on the hostorical usage. 
  maxReplicas: 3
  metrics:
    type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
      name1: memory
      target1:
        type: Utilization
        averageUtilization: 80


#crashloopbackoff
-------------------
#It means container keeps crashing after starting. 
#reason
---------------
#bug in code
#missing environment variables
#port already in use
#How to debug
---------------
#kubectl get pods -n <namespace>
#kubectl describe pod <podname> -n <namespace> - shows events
#kubectl logs <podname> --previous -n <namespace> - shows exact error (This shows the logs before container crashed)

#Imagepullbackoff
-------------------
#It means unable to pull the image
#reason
---------
#either image is not available in the registry
#imagename incorrect
#wrong tag
#how to debug
--------------
#kubectl get pods -n <namespace>
#Kubectl describe pod <podname>  -n <namespace>