# Default values for genwizard-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
app:
  replicaCount: 1
  repository: 153590191236.dkr.ecr.us-east-1.amazonaws.com/genwizard-dedicated-repo-dev
  pullPolicy: Always
  tag: "ai_brownfield_python_api_aci_6_4"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  resources:
    limits:
      cpu: "4000m"
      memory: "8096Mi"
    requests:
      cpu: "4000m"
      memory: "8096Mi"

env:
  name: "ASPNETCORE_ENVIRONMENT"
  values: "Development"
  name1: "ASPNETCORE_FORWARDEDHEADERS_ENABLED"
  values1: "true"

volumes:                    #volumes are defined at pod level
  name: efs-mount           #this is persistant volume(pv-ex: efs, ebs)
  persistentVolumeClaim:     #pvc
    claimName: pvc-ad-claim  #this is persistantvolumeclaim(pvc)/pod requests storage from kubernetes, and kubernetes looks for a matching pv and attach storage to pod.

volumeMounts:                             #volumemounts are defined at containerlevel
  mountPath: /var/www/appConfigFiles      #container mounts at specified mountpath.
  name: efs-mount
  mountPath1: /mnt/myWizard-Phoenix
  mountPath2: /var/www/Logs   

service:
  ports:
    port: 80
    protocol: TCP
    targetPort: 9030
  type: ClusterIP

